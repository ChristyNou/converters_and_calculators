<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #eef2f7;
            font-family: Arial, sans-serif;
        }

        .calculator {
            width: min(92vw, 400px);
            padding: 20px;
            border-radius: 16px;
            background: #1f2937;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
        }

        .display {
            min-height: 86px;
            margin-bottom: 16px;
            padding: 12px 16px;
            border-radius: 10px;
            background: #111827;
            color: white;
            text-align: right;
            overflow-wrap: anywhere;
        }

        #expression {
            min-height: 24px;
            color: #9ca3af;
            font-size: 15px;
        }

        #result {
            margin-top: 8px;
            color: #f9fafb;
            font-size: 30px;
            font-weight: bold;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            min-height: 52px;
            border: 0;
            border-radius: 9px;
            background: #374151;
            color: white;
            cursor: pointer;
            font-size: 17px;
            transition: background 0.15s, transform 0.15s;
        }

        button:hover {
            background: #4b5563;
        }

        button:active {
            transform: scale(0.96);
        }

        .operator {
            background: #2563eb;
        }

        .operator:hover {
            background: #3b82f6;
        }

        .function {
            background: #7c3aed;
        }

        .function:hover {
            background: #8b5cf6;
        }

        .clear {
            background: #dc2626;
        }

        .equals {
            grid-column: span 2;
            background: #059669;
        }

        .equals:hover {
            background: #10b981;
        }
    </style>
</head>
<body>
    <main class="calculator" aria-label="Scientific calculator">
        <section class="display" aria-live="polite">
            <div id="expression">0</div>
            <div id="result">0</div>
        </section>

        <section class="buttons">
            <button class="clear" type="button" onclick="clearCalculator()">C</button>
            <button type="button" onclick="backspace()">⌫</button>
            <button class="function" type="button" onclick="chooseFunction('sqrt')">√</button>
            <button class="operator" type="button" onclick="chooseOperator('/')">÷</button>

            <button type="button" onclick="appendValue('7')">7</button>
            <button type="button" onclick="appendValue('8')">8</button>
            <button type="button" onclick="appendValue('9')">9</button>
            <button class="operator" type="button" onclick="chooseOperator('*')">×</button>

            <button type="button" onclick="appendValue('4')">4</button>
            <button type="button" onclick="appendValue('5')">5</button>
            <button type="button" onclick="appendValue('6')">6</button>
            <button class="operator" type="button" onclick="chooseOperator('-')">−</button>

            <button type="button" onclick="appendValue('1')">1</button>
            <button type="button" onclick="appendValue('2')">2</button>
            <button type="button" onclick="appendValue('3')">3</button>
            <button class="operator" type="button" onclick="chooseOperator('+')">+</button>

            <button type="button" onclick="appendValue('0')">0</button>
            <button type="button" onclick="appendValue('.')">.</button>
            <button class="function" type="button" onclick="chooseOperator('**')">xʸ</button>
            <button class="function" type="button" onclick="chooseFunction('factorial')">n!</button>

            <button class="function" type="button" onclick="chooseFunction('abs')">abs</button>
            <button class="function" type="button" onclick="chooseFunction('sin')">sin</button>
            <button class="function" type="button" onclick="chooseFunction('cos')">cos</button>
            <button class="function" type="button" onclick="chooseFunction('tan')">tan</button>

            <button class="equals" type="button" onclick="calculate()">=</button>
            <button type="button" onclick="appendValue('%')">%</button>
        </section>
    </main>

    <script>
        var firstNumber = '';
        var operator = '';
        var waitingForSecondNumber = false;
        var expressionElement = document.getElementById('expression');
        var resultElement = document.getElementById('result');

        function appendValue(value) {
            if (waitingForSecondNumber) {
                resultElement.textContent = '';
                waitingForSecondNumber = false;
            }

            if (value === '.' && resultElement.textContent.indexOf('.') !== -1) {
                return;
            }

            if (resultElement.textContent === '0' && value !== '.') {
                resultElement.textContent = value;
            } else {
                resultElement.textContent += value;
            }
        }

        function chooseOperator(selectedOperator) {
            firstNumber = resultElement.textContent;
            operator = selectedOperator;
            waitingForSecondNumber = true;
            expressionElement.textContent = firstNumber + ' ' + selectedOperator;
        }

        function chooseFunction(functionName) {
            var number = Number(resultElement.textContent);
            var answer;

            if (functionName === 'sqrt') {
                if (number < 0) return showError('Invalid square root');
                answer = Math.sqrt(number);
            } else if (functionName === 'factorial') {
                if (number < 0 || number % 1 !== 0) return showError('Invalid factorial');
                answer = 1;
                for (var i = 2; i <= number; i += 1) answer *= i;
            } else if (functionName === 'abs') {
                answer = Math.abs(number);
            } else {
                answer = Math[functionName](number * Math.PI / 180);
            }

            resultElement.textContent = formatResult(answer);
            expressionElement.textContent = functionName + '(' + number + ')';
        }

        function calculate() {
            if (!operator || firstNumber === '') return;

            var secondNumber = Number(resultElement.textContent);
            var first = Number(firstNumber);
            var answer;

            if ((operator === '/' || operator === '%') && secondNumber === 0) {
                return showError('Cannot divide by zero');
            }

            if (operator === '+') answer = first + secondNumber;
            else if (operator === '-') answer = first - secondNumber;
            else if (operator === '*') answer = first * secondNumber;
            else if (operator === '/') answer = first / secondNumber;
            else if (operator === '%') answer = first % secondNumber;
            else if (operator === '**') answer = Math.pow(first, secondNumber);

            expressionElement.textContent = first + ' ' + operator + ' ' + secondNumber;
            resultElement.textContent = formatResult(answer);
            firstNumber = '';
            operator = '';
            waitingForSecondNumber = true;
        }

        function formatResult(value) {
            return Number.isInteger(value) ? String(value) : String(Number(value.toFixed(10)));
        }

        function backspace() {
            var value = resultElement.textContent;
            resultElement.textContent = value.length > 1 ? value.slice(0, -1) : '0';
        }

        function clearCalculator() {
            firstNumber = '';
            operator = '';
            waitingForSecondNumber = false;
            expressionElement.textContent = '0';
            resultElement.textContent = '0';
        }

        function showError(message) {
            expressionElement.textContent = 'Error';
            resultElement.textContent = message;
            firstNumber = '';
            operator = '';
            waitingForSecondNumber = true;
        }
    </script>
</body>
</html>
